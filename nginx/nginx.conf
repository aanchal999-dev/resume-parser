upstream api_upstream {
    server api:3000;
}

server {
    listen 80;
    server_name localhost;

    # Maximum file upload size for bulk resume processing (50MB)
    client_max_body_size 50M;
    # Security Headers - Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
    # Gzip compression for high-performance throughput
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Angular Static Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm; 
        try_files $uri $uri/ /index.html;
    }

    # ==============================================================================
    # 1. Server-Sent Events (SSE) Live Stream Endpoint
    # ==============================================================================
    location ~* ^/api/resumes/stream/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # Disable buffering and caching for instantaneous live SSE pushes
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Keep connection open for long-running batches
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================================
    # 2. REST API Microservice Routes
    # ==============================================================================
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health Check Endpoint for Load Balancers & Monitoring
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
